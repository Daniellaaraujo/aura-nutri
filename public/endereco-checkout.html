<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolher Endereço — Aura Nutri</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #FAF8F4;
      --warm: #F2EDE4;
      --gold: #B8965A;
      --gold-light: #D4AE72;
      --dark: #1A1714;
      --mid: #4A4540;
      --soft: #8A827A;
      --white: #FFFFFF;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid rgba(184,150,90,0.2);
      background: var(--cream);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; letter-spacing: 0.08em; color: var(--dark); text-decoration: none; }
    .logo span { color: var(--gold); }
    .btn-nav {
      background: none; border: 1px solid rgba(184,150,90,0.4); color: var(--gold);
      padding: 0.4rem 1.1rem; border-radius: 2rem; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: all 0.2s;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-nav:hover { background: var(--gold); color: var(--white); }

    /* ── LAYOUT: dois painéis ── */
    .checkout-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2.5rem;
      align-items: start;
    }

    @media (max-width: 760px) {
      .checkout-wrap { grid-template-columns: 1fr; }
      nav { padding: 1.25rem 1.5rem; }
    }

    /* ── PAINEL ESQUERDO: endereços ── */
    .painel-titulo-label { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
    .painel-titulo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 600; color: var(--dark); line-height: 1.1; margin-bottom: 2rem;
    }
    .painel-titulo em { color: var(--gold); font-style: italic; }

    /* ── SPINNER ── */
    .spinner-wrap { display: flex; align-items: center; gap: 0.75rem; color: var(--soft); font-size: 0.85rem; padding: 1rem 0; }
    .spinner { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(184,150,90,0.2); border-top-color: var(--gold); animation: spin 0.9s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── LISTA DE ENDEREÇOS ── */
    .enderecos-lista { display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 1.5rem; }

    .endereco-card {
      border: 2px solid rgba(184,150,90,0.15);
      border-radius: 0.75rem;
      padding: 1.1rem 1.25rem;
      cursor: pointer;
      background: var(--white);
      transition: border-color 0.2s, background 0.2s;
      display: flex; align-items: flex-start; gap: 1rem;
      position: relative;
    }
    .endereco-card:hover { border-color: rgba(184,150,90,0.5); }
    .endereco-card.selecionado { border-color: var(--gold); background: #FFFBF5; }

    /* Círculo de seleção */
    .radio-circulo {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(184,150,90,0.35);
      flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    .endereco-card.selecionado .radio-circulo {
      border-color: var(--gold);
      background: var(--gold);
    }
    .radio-circulo::after {
      content: '';
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--white);
      display: none;
    }
    .endereco-card.selecionado .radio-circulo::after { display: block; }

    .endereco-info { flex: 1; }
    .endereco-rua { font-size: 0.92rem; font-weight: 500; color: var(--dark); margin-bottom: 0.2rem; }
    .endereco-complemento { font-size: 0.78rem; color: var(--soft); margin-bottom: 0.2rem; }
    .endereco-cidade { font-size: 0.82rem; color: var(--mid); }

    .badge-principal {
      display: inline-block;
      font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); border: 1px solid rgba(184,150,90,0.4);
      border-radius: 2rem; padding: 0.15rem 0.6rem;
      margin-top: 0.5rem;
    }

    .btn-excluir-end {
      position: absolute; top: 0.75rem; right: 0.85rem;
      background: none; border: none; color: var(--soft);
      font-size: 0.75rem; cursor: pointer; opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .endereco-card:hover .btn-excluir-end { opacity: 1; }
    .btn-excluir-end:hover { color: #DC2626; }

    /* ── NOVO ENDEREÇO ── */
    .secao-novo { margin-top: 0.5rem; }
    .btn-toggle-form {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: none; border: 1px dashed rgba(184,150,90,0.4);
      color: var(--gold); border-radius: 0.5rem;
      padding: 0.75rem 1.25rem; width: 100%; justify-content: center;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-toggle-form:hover { background: rgba(184,150,90,0.07); border-color: var(--gold); }

    .form-novo-end {
      display: none;
      background: var(--white);
      border: 1px solid rgba(184,150,90,0.2);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-top: 0.85rem;
    }
    .form-novo-end.aberto { display: block; }

    .form-titulo { font-size: 0.8rem; font-weight: 500; color: var(--dark); margin-bottom: 1.25rem; letter-spacing: 0.05em; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    .form-grid .full { grid-column: 1 / -1; }

    .campo-grupo { display: flex; flex-direction: column; gap: 0.35rem; }
    .campo-grupo label { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--soft); }
    .campo-grupo input {
      border: 1px solid rgba(184,150,90,0.25); border-radius: 0.35rem;
      padding: 0.65rem 0.9rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
      color: var(--dark); background: var(--cream); outline: none;
      transition: border-color 0.2s;
    }
    .campo-grupo input:focus { border-color: var(--gold); background: var(--white); }
    .campo-grupo input::placeholder { color: var(--soft); opacity: 0.5; }

    .btn-salvar-end {
      width: 100%; background: var(--dark); color: var(--cream);
      border: none; border-radius: 0.35rem; padding: 0.8rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s; margin-top: 1rem;
    }
    .btn-salvar-end:hover { background: var(--gold); }
    .btn-salvar-end:disabled { opacity: 0.6; pointer-events: none; }

    /* ── MENSAGENS ── */
    .msg {
      padding: 0.75rem 1rem; border-radius: 0.35rem;
      font-size: 0.82rem; margin-top: 0.75rem; display: none;
    }
    .msg.erro { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; display: block; }
    .msg.sucesso { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; display: block; }

    /* ── PAINEL DIREITO: resumo do pedido ── */
    .resumo {
      background: var(--white);
      border: 1px solid rgba(184,150,90,0.15);
      border-radius: 1rem;
      padding: 1.5rem;
      position: sticky; top: 100px;
    }
    .resumo-titulo { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: var(--dark); margin-bottom: 1.25rem; padding-bottom: 0.85rem; border-bottom: 1px solid rgba(184,150,90,0.15); }

    .resumo-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.6rem 0; border-bottom: 1px solid rgba(184,150,90,0.08); }
    .resumo-item:last-of-type { border-bottom: none; }
    .resumo-item-nome { font-size: 0.85rem; color: var(--mid); }
    .resumo-item-qtd { font-size: 0.72rem; color: var(--soft); }
    .resumo-item-preco { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: var(--dark); }

    .resumo-linha { display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.85rem; color: var(--soft); }
    .resumo-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 0.85rem; border-top: 1px solid rgba(184,150,90,0.2); margin-top: 0.5rem; }
    .resumo-total span:first-child { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--soft); }
    .resumo-total-valor { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; color: var(--dark); }

    .btn-pagar {
      width: 100%; background: var(--dark); color: var(--cream);
      border: none; border-radius: 0.35rem; padding: 1rem;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: background 0.25s;
      margin-top: 1.25rem; display: flex; align-items: center;
      justify-content: center; gap: 0.5rem;
    }
    .btn-pagar:hover { background: var(--gold); }
    .btn-pagar:disabled { opacity: 0.5; pointer-events: none; }

    .resumo-aviso {
      font-size: 0.72rem; color: var(--soft); text-align: center;
      margin-top: 0.75rem; line-height: 1.5;
    }
    .resumo-end-selecionado {
      background: var(--cream); border-radius: 0.5rem;
      padding: 0.75rem 1rem; margin-top: 1rem;
      font-size: 0.8rem; color: var(--mid); line-height: 1.55;
      border: 1px solid rgba(184,150,90,0.15);
      display: none;
    }
    .resumo-end-selecionado.visivel { display: block; }
    .resumo-end-label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--soft); margin-bottom: 0.3rem; }

    /* Aviso sem endereço */
    .aviso-sem-end {
      background: #FEF9EE; border: 1px solid #FDE68A;
      border-radius: 0.5rem; padding: 0.75rem 1rem;
      font-size: 0.8rem; color: #92400E;
      margin-top: 1rem; text-align: center;
      display: none;
    }
    .aviso-sem-end.visivel { display: block; }
  </style>
</head>
<body>

  <!-- ══ NAV ══ -->
  <nav>
    <a class="logo" href="/index.html">Aura <span>Nutri</span></a>
    <a href="/index.html" class="btn-nav">← Voltar</a>
  </nav>

  <!-- ══ CONTEÚDO ══ -->
  <div class="checkout-wrap">

    <!-- PAINEL ESQUERDO -->
    <div class="painel-esq">
      <p class="painel-titulo-label">Passo 1 de 2</p>
      <h1 class="painel-titulo">Escolha o <em>endereço</em><br>de entrega</h1>

      <!-- Spinner de carregamento -->
      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span>Buscando seus endereços...</span>
      </div>

      <!-- Mensagem geral -->
      <div class="msg" id="msg-geral"></div>

      <!-- Lista de endereços -->
      <div class="enderecos-lista" id="enderecos-lista" style="display:none;"></div>

      <!-- Botão e form de novo endereço -->
      <div class="secao-novo" id="secao-novo" style="display:none;">
        <button class="btn-toggle-form" onclick="toggleForm()">
          <span id="toggle-icone">＋</span>
          <span id="toggle-texto">Adicionar novo endereço</span>
        </button>

        <div class="form-novo-end" id="form-novo">
          <p class="form-titulo">Novo endereço de entrega</p>

          <div class="form-grid">
            <div class="campo-grupo full">
              <label>CEP <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-cep" placeholder="00000-000" maxlength="9"
                oninput="mascaraCep(this)" onblur="buscarCep()" />
            </div>
            <div class="campo-grupo full">
              <label>Rua / Avenida <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-rua" placeholder="Nome da rua" />
            </div>
            <div class="campo-grupo">
              <label>Número <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-numero" placeholder="123" />
            </div>
            <div class="campo-grupo">
              <label>Complemento</label>
              <input type="text" id="end-complemento" placeholder="Apto, bloco..." />
            </div>
            <div class="campo-grupo">
              <label>Bairro <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-bairro" placeholder="Seu bairro" />
            </div>
            <div class="campo-grupo">
              <label>Cidade <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-cidade" placeholder="Sua cidade" />
            </div>
            <div class="campo-grupo">
              <label>Estado <span style="color:#DC2626">*</span></label>
              <input type="text" id="end-estado" placeholder="MG" maxlength="2" />
            </div>
          </div>

          <div class="msg" id="msg-form"></div>
          <button class="btn-salvar-end" id="btn-salvar" onclick="salvarEndereco()">Salvar endereço</button>
        </div>
      </div>
    </div>

    <!-- PAINEL DIREITO: resumo -->
    <aside class="resumo">
      <div class="resumo-titulo">Resumo do pedido</div>

      <div id="resumo-itens">
        <!-- Preenchido via JS com os itens do carrinho -->
      </div>

      <div style="margin-top:0.75rem;">
        <div class="resumo-linha">
          <span>Subtotal</span>
          <span id="resumo-subtotal">—</span>
        </div>
        <!-- Opções de frete -->
        <div id="bloco-frete" style="margin:0.75rem 0;display:none;">
          <div style="font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--soft);margin-bottom:0.5rem;">Escolha o frete</div>
          <div id="frete-carregando" style="font-size:0.8rem;color:var(--soft);display:none;">Calculando frete...</div>
          <div id="frete-opcoes" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
        </div>
        <div class="resumo-linha">
          <span>Frete</span>
          <span id="resumo-frete">—</span>
        </div>
      </div>

      <div class="resumo-total">
        <span>Total</span>
        <span class="resumo-total-valor" id="resumo-total">—</span>
      </div>

      <!-- Endereço selecionado aparece aqui -->
      <div class="resumo-end-selecionado" id="resumo-end">
        <div class="resumo-end-label">Entregar em</div>
        <div id="resumo-end-texto"></div>
      </div>

      <!-- Aviso se não tiver endereço selecionado -->
      <div class="aviso-sem-end visivel" id="aviso-sem-end">
        Selecione um endereço para continuar
      </div>

      <button class="btn-pagar" id="btn-pagar" disabled onclick="irParaPagamento()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        Ir para pagamento
      </button>
      <p class="resumo-aviso">Pagamento processado com segurança pelo Stripe</p>
    </aside>

  </div>

  <script>
    // ═══════════════════════════════════════════
    // URL BASE DO BACKEND
const API_BASE = 'https://backend-suplementos-0ul1.onrender.com';
    // ═══════════════════════════════════════════

    // ── Estado da página ──
    let enderecoSelecionadoId = null;
    let enderecos = [];
    let freteSelecionado = 0;

    // ── Helpers ──
    function pegarToken() { return localStorage.getItem('aura_token'); }
    function pegarCliente() {
      try { return JSON.parse(localStorage.getItem('aura_cliente')) || null; }
      catch { return null; }
    }

    function mostrarMsg(id, texto, tipo) {
      const el = document.getElementById(id);
      el.textContent = texto;
      el.className = 'msg ' + tipo;
    }

    function esconderMsg(id) {
      const el = document.getElementById(id);
      el.className = 'msg';
      el.textContent = '';
    }

    // ── Máscara de CEP ──
    function mascaraCep(input) {
      let v = input.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
      input.value = v;
    }

    // ── Busca endereço pelo CEP (ViaCEP) ──
    async function buscarCep() {
      const cep = document.getElementById('end-cep').value.replace(/\D/g, '');
      if (cep.length !== 8) return;
      try {
        const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const d = await r.json();
        if (!d.erro) {
          document.getElementById('end-rua').value    = d.logradouro || '';
          document.getElementById('end-bairro').value = d.bairro || '';
          document.getElementById('end-cidade').value = d.localidade || '';
          document.getElementById('end-estado').value = d.uf || '';
          document.getElementById('end-numero').focus();
        }
      } catch { /* se não achar, o usuário preenche manualmente */ }
    }

    // ── Abre/fecha formulário de novo endereço ──
    function toggleForm() {
      const form = document.getElementById('form-novo');
      const aberto = form.classList.contains('aberto');
      form.classList.toggle('aberto');
      document.getElementById('toggle-icone').textContent = aberto ? '＋' : '−';
      document.getElementById('toggle-texto').textContent = aberto ? 'Adicionar novo endereço' : 'Cancelar';
      esconderMsg('msg-form');
    }

    // ── Renderiza um card de endereço ──
    function renderEndereco(end) {
      const selecionado = end.id === enderecoSelecionadoId;
      return `
        <div class="endereco-card ${selecionado ? 'selecionado' : ''}"
             onclick="selecionarEndereco(${end.id})"
             id="card-end-${end.id}">
          <div class="radio-circulo"></div>
          <div class="endereco-info">
            <div class="endereco-rua">${end.rua}, ${end.numero}</div>
            ${end.complemento ? `<div class="endereco-complemento">${end.complemento}</div>` : ''}
            <div class="endereco-cidade">${end.bairro} · ${end.cidade} – ${end.estado} · CEP ${end.cep}</div>
            ${end.principal ? `<span class="badge-principal">Principal</span>` : ''}
          </div>
          <button class="btn-excluir-end" onclick="excluirEndereco(event, ${end.id})" title="Remover">✕</button>
        </div>
      `;
    }

    // ── Seleciona um endereço ──
    function selecionarEndereco(id) {
      enderecoSelecionadoId = id;

      // Atualiza visual dos cards
      enderecos.forEach(e => {
        const card = document.getElementById('card-end-' + e.id);
        if (card) card.classList.toggle('selecionado', e.id === id);
      });

      // Atualiza o painel direito
      const end = enderecos.find(e => e.id === id);
      if (end) {
        document.getElementById('resumo-end-texto').textContent =
          `${end.rua}, ${end.numero}${end.complemento ? ' – ' + end.complemento : ''}\n${end.bairro} · ${end.cidade}/${end.estado}`;
        document.getElementById('resumo-end').classList.add('visivel');
        document.getElementById('aviso-sem-end').classList.remove('visivel');
      }

      document.getElementById('btn-pagar').disabled = false;

      // Calcula frete para o CEP do endereço selecionado
      if (end && end.cep) calcularFrete(end.cep);
    }

    // ── Carrega endereços do servidor ──
    async function carregarEnderecos() {
      const token = pegarToken();
      if (!token) {
        // Se não logado, redireciona para home (onde está o login)
        window.location.href = '/index.html';
        return;
      }

      try {
        const r = await fetch(`${API_BASE}/api/enderecos`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const dados = await r.json();
        enderecos = dados;

        document.getElementById('spinner').style.display = 'none';
        document.getElementById('enderecos-lista').style.display = 'flex';
        document.getElementById('secao-novo').style.display = 'block';

        const lista = document.getElementById('enderecos-lista');

        if (enderecos.length === 0) {
          lista.innerHTML = '<p style="font-size:0.85rem;color:var(--soft);padding:0.5rem 0;">Você ainda não tem endereços salvos. Adicione um abaixo.</p>';
          // Abre o form automaticamente se não há endereços
          document.getElementById('form-novo').classList.add('aberto');
          document.getElementById('toggle-icone').textContent = '−';
          document.getElementById('toggle-texto').textContent = 'Cancelar';
        } else {
          lista.innerHTML = enderecos.map(renderEndereco).join('');
          // Pré-seleciona o endereço principal
          const principal = enderecos.find(e => e.principal) || enderecos[0];
          if (principal) selecionarEndereco(principal.id);
        }

      } catch (erro) {
        document.getElementById('spinner').style.display = 'none';
        mostrarMsg('msg-geral', '⚠️ Erro ao carregar endereços. Tente recarregar a página.', 'erro');
      }
    }

    // ── Salva novo endereço ──
    async function salvarEndereco() {
      const rua         = document.getElementById('end-rua').value.trim();
      const numero      = document.getElementById('end-numero').value.trim();
      const complemento = document.getElementById('end-complemento').value.trim();
      const bairro      = document.getElementById('end-bairro').value.trim();
      const cidade      = document.getElementById('end-cidade').value.trim();
      const estado      = document.getElementById('end-estado').value.trim();
      const cep         = document.getElementById('end-cep').value.trim();

      if (!rua || !numero || !bairro || !cidade || !estado || !cep) {
        mostrarMsg('msg-form', 'Preencha todos os campos obrigatórios.', 'erro');
        return;
      }

      const btn = document.getElementById('btn-salvar');
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      esconderMsg('msg-form');

      try {
        const token = pegarToken();
        const r = await fetch(`${API_BASE}/api/enderecos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ rua, numero, complemento, bairro, cidade, estado, cep })
        });

        const dados = await r.json();

        if (!r.ok) {
          mostrarMsg('msg-form', dados.erro || 'Erro ao salvar.', 'erro');
          return;
        }

        // Adiciona na lista e seleciona automaticamente
        enderecos.push(dados);
        const lista = document.getElementById('enderecos-lista');
        lista.style.display = 'flex';
        lista.innerHTML = enderecos.map(renderEndereco).join('');
        selecionarEndereco(dados.id);

        // Fecha o form e limpa os campos
        toggleForm();
        ['end-cep','end-rua','end-numero','end-complemento','end-bairro','end-cidade','end-estado']
          .forEach(id => document.getElementById(id).value = '');

      } catch {
        mostrarMsg('msg-form', 'Erro de conexão. Tente novamente.', 'erro');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar endereço';
      }
    }

    // ── Exclui endereço ──
    async function excluirEndereco(evento, id) {
      evento.stopPropagation(); // evita selecionar ao clicar em excluir
      if (!confirm('Remover este endereço?')) return;

      try {
        const token = pegarToken();
        const r = await fetch(`${API_BASE}/api/enderecos/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (r.ok) {
          enderecos = enderecos.filter(e => e.id !== id);
          if (enderecoSelecionadoId === id) {
            enderecoSelecionadoId = null;
            document.getElementById('btn-pagar').disabled = true;
            document.getElementById('resumo-end').classList.remove('visivel');
            document.getElementById('aviso-sem-end').classList.add('visivel');
          }
          const lista = document.getElementById('enderecos-lista');
          lista.innerHTML = enderecos.length > 0
            ? enderecos.map(renderEndereco).join('')
            : '<p style="font-size:0.85rem;color:var(--soft);padding:0.5rem 0;">Nenhum endereço salvo. Adicione um abaixo.</p>';
        }
      } catch {
        alert('Erro ao remover endereço.');
      }
    }

    // ── Vai para pagamento ──
    async function irParaPagamento() {
      if (!enderecoSelecionadoId) return;

      const btn = document.getElementById('btn-pagar');
      btn.disabled = true;
      btn.textContent = 'Aguarde...';

      try {
        const token   = pegarToken();
        const cliente = pegarCliente();

        // Pega itens do carrinho salvo no navegador
        const carrinho = JSON.parse(localStorage.getItem('aura_carrinho') || '{}');

        // Monta a lista de itens para o backend
        // Aqui usamos o array fixo de produtos (igual ao index.html)
        const PRODUTOS = window._PRODUTOS || [
          { id: 'coenzima-q10',    nome: 'Coenzima Q10',     preco: 190.00 },
          { id: 'colageno-marino', nome: 'Colágeno Marinho',  preco: 145.00 },
          { id: 'vitamina-d3',     nome: 'Vitamina D3 + K2',  preco: 89.00  },
          { id: 'omega-3',         nome: 'Ômega-3 Ultra',     preco: 120.00 },
          { id: 'magnesio',        nome: 'Magnésio Quelato',  preco: 75.00  },
        ];

        const itensSelecionados = Object.entries(carrinho)
          .filter(([, qtd]) => qtd > 0)
          .map(([id, qtd]) => {
            const prod = PRODUTOS.find(p => String(p.id) === String(id));
            return prod ? { nome: prod.nome, preco: prod.preco, quantidade: qtd } : null;
          })
          .filter(Boolean);

        // Se o carrinho estiver vazio, usa o produto principal da landing page
        const itensFinais = itensSelecionados.length > 0
          ? itensSelecionados
          : [{ nome: 'Coenzima Q10 Premium — Aura Nutri', preco: 19.00, quantidade: 1 }];

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        const res = await fetch('https://backend-suplementos-0ul1.onrender.com/criar-checkout', {
          method: 'POST',
          headers,
          body: JSON.stringify({
            cliente_id:   cliente?.id || null,
            endereco_id:  enderecoSelecionadoId,
            itens:        itensFinais
          })
        });

        const data = await res.json();

        if (data.url) {
          window.location.href = data.url; // redireciona para o Stripe
        } else {
          alert('Erro ao iniciar pagamento. Tente novamente.');
          btn.disabled = false;
          btn.textContent = 'Ir para pagamento';
        }

      } catch {
        alert('Erro de conexão. Verifique se o servidor está rodando.');
        btn.disabled = false;
        btn.textContent = 'Ir para pagamento';
      }
    }

    // ── Calcula frete via Melhor Envio ──
    async function calcularFrete(cep) {
      const blocoFrete  = document.getElementById('bloco-frete');
      const carregando  = document.getElementById('frete-carregando');
      const opcoes      = document.getElementById('frete-opcoes');

      freteSelecionado = 0;
      document.getElementById('resumo-frete').textContent = '—';
      blocoFrete.style.display  = 'block';
      carregando.style.display  = 'block';
      opcoes.innerHTML = '';

      try {
        const r = await fetch(`${API_BASE}/api/frete/calcular`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cep_destino: cep })
        });

        const dados = await r.json();
        carregando.style.display = 'none';

        if (!r.ok || dados.erro) {
          opcoes.innerHTML = `<p style="font-size:0.8rem;color:#DC2626;">${dados.erro || 'Frete indisponível para este CEP.'}</p>`;
          return;
        }

        opcoes.innerHTML = dados.map(op => `
          <label style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.75rem;border:1px solid rgba(184,150,90,0.2);border-radius:0.5rem;cursor:pointer;font-size:0.82rem;background:var(--white);">
            <input type="radio" name="frete" value="${op.preco}" onchange="selecionarFrete(${op.preco})" style="accent-color:var(--gold);" />
            <div style="flex:1;">
              <div style="font-weight:500;color:var(--dark);">${op.empresa} — ${op.nome}</div>
              <div style="color:var(--soft);font-size:0.75rem;">Prazo: ${op.prazo} dia${op.prazo > 1 ? 's' : ''} útil${op.prazo > 1 ? 'eis' : ''}</div>
            </div>
            <div style="font-weight:600;color:var(--gold);white-space:nowrap;">R$ ${op.preco.toFixed(2).replace('.',',')}</div>
          </label>
        `).join('');

      } catch {
        carregando.style.display = 'none';
        opcoes.innerHTML = '<p style="font-size:0.8rem;color:#DC2626;">Erro ao calcular frete. Tente novamente.</p>';
      }
    }

    // ── Seleciona opção de frete ──
    function selecionarFrete(preco) {
      freteSelecionado = preco;
      document.getElementById('resumo-frete').textContent = 'R$ ' + preco.toFixed(2).replace('.', ',');

      // Recalcula total
      const subtotalTxt = document.getElementById('resumo-subtotal').textContent;
      const subtotal = parseFloat(subtotalTxt.replace('R$ ', '').replace(',', '.')) || 0;
      document.getElementById('resumo-total').textContent = 'R$ ' + (subtotal + preco).toFixed(2).replace('.', ',');
    }

    // ── Renderiza resumo do carrinho no painel direito ──
    function renderResumo() {
      const PRODUTOS = window._PRODUTOS || [
        { id: 'coenzima-q10',    nome: 'Coenzima Q10',     preco: 190.00 },
        { id: 'colageno-marino', nome: 'Colágeno Marinho',  preco: 145.00 },
        { id: 'vitamina-d3',     nome: 'Vitamina D3 + K2',  preco: 89.00  },
        { id: 'omega-3',         nome: 'Ômega-3 Ultra',     preco: 120.00 },
        { id: 'magnesio',        nome: 'Magnésio Quelato',  preco: 75.00  },
      ];

      const carrinho = JSON.parse(localStorage.getItem('aura_carrinho') || '{}');
      const itens = Object.entries(carrinho).filter(([, q]) => q > 0);

      const container = document.getElementById('resumo-itens');
      let subtotal = 0;

      if (itens.length === 0) {
        // Produto padrão da landing page
        container.innerHTML = `
          <div class="resumo-item">
            <div>
              <div class="resumo-item-nome">Coenzima Q10 Premium</div>
              <div class="resumo-item-qtd">Qtd: 1</div>
            </div>
            <div class="resumo-item-preco">R$ 19,00</div>
          </div>`;
        subtotal = 19;
      } else {
        container.innerHTML = itens.map(([id, qtd]) => {
          const prod = PRODUTOS.find(p => String(p.id) === String(id));
          if (!prod) return '';
          const total = prod.preco * qtd;
          subtotal += total;
          return `
            <div class="resumo-item">
              <div>
                <div class="resumo-item-nome">${prod.nome}</div>
                <div class="resumo-item-qtd">Qtd: ${qtd}</div>
              </div>
              <div class="resumo-item-preco">R$ ${total.toFixed(2).replace('.', ',')}</div>
            </div>`;
        }).join('');
      }

      const fmt = v => 'R$ ' + v.toFixed(2).replace('.', ',');
      document.getElementById('resumo-subtotal').textContent = fmt(subtotal);
      document.getElementById('resumo-total').textContent    = fmt(subtotal);
    }

    // ── Inicia a página ──
  fetch('https://backend-suplementos-0ul1.onrender.com/api/produtos')
  .then(r => r.json())
  .then(data => { window._PRODUTOS = data; renderResumo(); });
    carregarEnderecos();
  </script>

</body>
